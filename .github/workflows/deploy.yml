# Deploy to cPanel hosting over FTP on every push to main.
# Replaces cPanel "Git Version Control → Deploy HEAD Commit".
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    sago.iixcp.rumahweb.net (hosting hostname; its TLS certificate matches)
#   FTP_USERNAME  github-deploy@digiserv.my.id (cPanel → FTP Accounts, home = public_html)
#   FTP_PASSWORD  password of that FTP account
# Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#   FTP_SERVER_DIR  folder on the server, relative to the FTP account's home.
#                   Default "./" because the FTP account's home is already public_html.
#                   Use "public_html/" if you switch to the main cPanel account.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ]   || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Stop the deploy if any PHP file has a syntax error.
      - name: Lint PHP
        run: |
          php --version
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      # Same file list as .cpanel.yml: only these are published.
      - name: Build deploy folder
        run: |
          mkdir -p dist
          cp index.php .htaccess favicon.ico robots.txt sitemap.xml dist/
          cp -R img blog jasabikinwebsite billing admin content includes dist/
          # Never publish local databases or env files, even if they appear in the checkout.
          find dist -name '*.sqlite' -delete
          find dist -name '.env*' -delete
          find dist -name '.DS_Store' -delete
          echo "Files to deploy: $(find dist -type f | wc -l)"

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
